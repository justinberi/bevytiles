[package]
name = "bevytiles"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Geo-spatial terrain streaming engine for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ziv/bevytiles"
readme = "README.md"
keywords = ["bevy", "terrain", "gis", "streaming", "heightmap"]
categories = ["game-development", "rendering"]

[features]
default = ["render"]
# the streaming plugin: tile entities, their meshes and imagery materials.
# Without it: the LOD policy, the tile source and cache, and the CPU terrain
# geometry, for headless consumers (physics, sensors, preloading)
render = [
    "bevy/bevy_asset",
    "bevy/bevy_camera",
    "bevy/bevy_image",
    "bevy/bevy_light",
    "bevy/bevy_log",
    "bevy/bevy_mesh",
    "bevy/bevy_pbr",
    "bevy/bevy_render",
]
# the flight demo: a window, input, UI text
demo = [
    "render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_window",
    "bevy/bevy_winit",
    "bevy/default_font",
    "bevy/multi_threaded",
    "bevy/tonemapping_luts",
    "bevy/ktx2",
    "bevy/zstd_rust",
    "bevy/wayland",
    "bevy/x11",
]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = "3"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "demo"
required-features = ["demo"]
